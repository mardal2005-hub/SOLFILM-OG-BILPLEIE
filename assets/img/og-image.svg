    </radialGradient>
    <radialGradient id="cyo" cx="80%" cy="70%" r="60%"><stop offset="0" stop-color="#33c9e2" stop-opacity="0.18"/><stop offset="1" stop-color="#33c9e2" stop-opacity="0"/></radialGradient>
