  <text x="76" y="382" font-family="'Segoe UI',Arial,sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-1">Kaminskij</text>
  <text x="80" y="440" font-family="'Segoe UI',Arial,sans-serif" font-size="34" fill="#c4c8cd">Gi bilen et nytt uttrykk.</text>
